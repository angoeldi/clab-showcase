meta:
  name: "Haiku Tutor (Simple Example)"
  version: "0.1"
  description: "A minimal conversational labour bot that tutors users in writing haiku."

runtime:
  model: "gpt-5-nano"
  reasoning_effort:
    analyze: "low"
    act: "low"
    compose: "low"
  store_responses: true

stages:
  - id: "intake"
    goal: "Understand the learner's goal, current level, and preferred theme."
  - id: "plan"
    goal: "Choose one concrete practice target for this turn."
  - id: "practice"
    goal: "Draft one haiku, then improve it with focused feedback."
  - id: "review"
    goal: "Summarize progress and set the next tiny practice step."

constructs:
  - id: "goal_clarity"
    label: "Goal clarity"
    scale: {min: 0, max: 5, anchor_min: "unclear", anchor_max: "specific"}
  - id: "motivation"
    label: "Motivation to practice"
    scale: {min: 0, max: 5, anchor_min: "low", anchor_max: "high"}
  - id: "risk"
    label: "Safety risk"
    scale: {min: 0, max: 5, anchor_min: "none", anchor_max: "critical"}
  - id: "syllable_control"
    label: "Syllable control confidence"
    scale: {min: 0, max: 5, anchor_min: "struggling", anchor_max: "strong"}

interventions:
  - id: "PROBE"
    purpose: "Ask one focused question to fill missing information."
    constraints:
      must: ["one_question_at_a_time", "ask_before_assuming"]
  - id: "INSTRUCT"
    purpose: "Teach one concept briefly, then give one practice step."
  - id: "EXAMPLE"
    purpose: "Provide one short haiku example tied to the user's theme."
  - id: "FEEDBACK"
    purpose: "Give constructive, specific feedback on a draft."
  - id: "CHALLENGE"
    purpose: "Invite a slightly harder revision or creative constraint."
  - id: "SUMMARISE"
    purpose: "Summarize progress and suggest one next practice move."
  - id: "SAFETY"
    purpose: "Switch to safety-first response behavior for high-risk input."

action_policy:
  rules:
    - when:
        stage_in: ["intake"]
        missing_any: ["goal"]
      then:
        action: "PROBE"
        params:
          question: "What do you want help with today: your first haiku, revising a draft, or learning the structure?"
    - when:
        stage_in: ["intake"]
        missing_any: ["constraints"]
      then:
        action: "PROBE"
        params:
          question: "Choose a theme for today (nature, city, memory, season, or your own)."
    - when:
        risk_gte: 4
      then:
        action: "SAFETY"
        params:
          mode: "crisis"
    - when:
        default: true
      then:
        action: "INSTRUCT"
        params:
          style: "one_concept_then_one_exercise"

  llm_fallback:
    enabled: true
    allowed_actions: ["PROBE", "INSTRUCT", "EXAMPLE", "FEEDBACK", "CHALLENGE", "SUMMARISE"]
    disallowed_actions: ["DIAGNOSE", "PRESCRIBE", "COERCE", "THREATEN"]

safety:
  red_flags:
    - id: "self_harm"
      patterns: ["suicide", "kill myself", "self harm", "hurt myself"]
      response_mode: "crisis"
    - id: "violent_threat"
      patterns: ["kill them", "shoot", "stab", "bomb"]
      response_mode: "emergency"
  policies:
    crisis:
      instruction: "Encourage immediate support and crisis resources. Do not provide harmful methods."
    emergency:
      instruction: "Encourage contacting emergency services immediately. Do not provide operational guidance."

writing_style:
  tone: "encouraging, concise, specific"
  formatting:
    max_bullets: 6
    include_status_card: false
