[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haiku-example"
version = "0.1.0"
description = "LangGraph-based domain-general conversational labour chatbot scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "openai>=2.17.0,<3",
  "langgraph==1.0.8",
  "langgraph-checkpoint-sqlite==3.0.3",
  "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
postgres = [
  "langgraph-checkpoint-postgres>=3.0.1",
  "psycopg[binary]>=3.1.18",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["haiku_example", "*_example", "clab_bot"]
exclude = ["tests*"]
